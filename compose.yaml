services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: teh_coyo
      POSTGRES_USER: teh_coyo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teh_coyo -d teh_coyo']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
